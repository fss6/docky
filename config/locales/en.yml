# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  profiles:
    flashes:
      updated: Profile updated successfully.
    title_suffix: " · Dokivo"
    breadcrumb: Profile
    edit:
      title: Edit profile
      subtitle: Update your name, email, and photo.
    form:
      avatar: Profile photo
      avatar_hint: JPG, PNG, or WebP. Maximum 2 MB.
      remove_avatar: Remove photo
      cancel: Cancel
      submit: Save profile
    menu:
      edit: Edit profile
    errors:
      avatar_invalid: must be JPG, PNG, or WebP up to 2 MB

  account_profiles:
    flashes:
      updated: Account profile updated successfully.
    title_suffix: " · Dokivo"
    breadcrumb: Account
    edit:
      title: Account profile
      subtitle: Update your account details.
    form:
      logo: Account logo
      logo_hint: JPG, PNG, or WebP. Maximum 2 MB.
      remove_logo: Remove logo
      contact_email: Contact email
      section_account: Account details
      cancel: Cancel
      submit: Save profile
    menu:
      edit: Account profile
    subscription:
      heading: Plan and subscription
      read_only_hint: Billing information is read-only.
      plan: Plan
      status: Status
      period_end: Renewal
      trial_ends: Trial ends
      none: —
    errors:
      logo_invalid: must be JPG, PNG, or WebP up to 2 MB

  number:
    currency:
      format:
        format: "%u %n"
        negative_format: "%u -%n"
        unit: "R$"
        separator: ","
        delimiter: "."
        precision: 2

  dokivo:
    signup:
      disabled: "Public sign-up is disabled. Sign in with an existing account."
      cta_login: "Sign in"
